<app-loading-indicator [detectRouteTransitions]="true"></app-loading-indicator>

<a class="skip-link" href="#main-content">Skip to main content</a>

@if (showToolbar) {
  <header class="app-header">
    <mat-toolbar class="app-toolbar">
      <a routerLink="/home" class="logo" aria-label="Kangla overview">
        <span class="logo-mark"><img src="./images/kangla-transparent-96x96.png" alt="" height="36" width="36" /></span>
        <span>Kangla</span>
      </a>

      <nav class="primary-navigation" aria-label="Main navigation">
        <a mat-button routerLink="/home" routerLinkActive="active-navigation-item" [routerLinkActiveOptions]="{exact: true}" ariaCurrentWhenActive="page">
          <mat-icon>home</mat-icon>
          Overview
        </a>
        <a mat-button routerLink="/plants" routerLinkActive="active-navigation-item" ariaCurrentWhenActive="page">
          <mat-icon>local_florist</mat-icon>
          Plants
        </a>
        <a mat-button routerLink="/watering-devices" routerLinkActive="active-navigation-item" ariaCurrentWhenActive="page">
          <mat-icon>water</mat-icon>
          Devices
        </a>
      </nav>

      <button mat-icon-button [matMenuTriggerFor]="accountMenu" class="account-button" aria-label="Open account menu">
        <mat-icon>account_circle</mat-icon>
      </button>
    </mat-toolbar>
  </header>

  <mat-menu #accountMenu="matMenu" xPosition="before">
    @if (userInfo) {
      <div class="account-summary" (click)="$event.stopPropagation()">
        <span>Signed in as</span>
        <strong>{{ userInfo.email }}</strong>
      </div>
      <mat-divider></mat-divider>
    }
    <button mat-menu-item (click)="logout()">
      <mat-icon>logout</mat-icon>
      <span>Log out</span>
    </button>
    <mat-divider></mat-divider>
    <div class="version-info" (click)="$event.stopPropagation()">Version {{version}}</div>
  </mat-menu>

  <app-pwa-install-prompt></app-pwa-install-prompt>
}

<main id="main-content" class="app-main" [class.auth-main]="!showToolbar">
    <router-outlet></router-outlet>
</main>
