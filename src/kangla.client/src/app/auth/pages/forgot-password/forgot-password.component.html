<div class="auth-page">
  <mat-card class="auth-card">
    <mat-card-header>
      <mat-card-title>Forgot Password</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <form [formGroup]="forgotPasswordForm" (ngSubmit)="onSubmit()">
        <mat-form-field appearance="fill">
          <mat-label>Email</mat-label>
          <input matInput formControlName="email" type="email" required>
          <mat-error *ngIf="forgotPasswordForm.get('email')?.hasError('required')">
            Email is required
          </mat-error>
          <mat-error *ngIf="forgotPasswordForm.get('email')?.hasError('email')">
            Please enter a valid email
          </mat-error>
        </mat-form-field>  
        <button mat-flat-button class="full-width" color="primary" type="submit" [disabled]="forgotPasswordForm.invalid || isSubmitting" [attr.aria-busy]="isSubmitting">
          {{ isSubmitting ? 'Sending…' : 'Send Reset Email' }}
        </button>
      </form>
    </mat-card-content>
    <mat-card-actions class="auth-card-actions">
      <p class="auth-link-row"><a class="auth-link" routerLink="/login">Back to login</a></p>
    </mat-card-actions>
  </mat-card>
</div>
