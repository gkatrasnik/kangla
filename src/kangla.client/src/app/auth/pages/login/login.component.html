<div class="auth-page">
  <div class="logo-container">
    <h1 class="login-header">Kangla</h1>
    <img src="./images/kangla-transparent-crop.png" alt="kangla logo" height="80"/>
  </div>
  <mat-card class="auth-card">
    <mat-card-header>
      <mat-card-title>Login</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <mat-form-field appearance="fill">
          <mat-label>Email</mat-label>
          <input matInput formControlName="email" type="email" required>
          <mat-error *ngIf="loginForm.get('email')?.hasError('required')">
            Email is required
          </mat-error>
          <mat-error *ngIf="loginForm.get('email')?.hasError('email')">
            Please enter a valid email
          </mat-error>
        </mat-form-field>
  
        <mat-form-field appearance="fill">
          <mat-label>Password</mat-label>
          <input matInput formControlName="password" type="password" required>
          <mat-error *ngIf="loginForm.get('password')?.hasError('required')">
            Password is required
          </mat-error>
          <mat-error *ngIf="loginForm.get('password')?.hasError('minlength')">
            Password must be at least 6 characters long
          </mat-error>
        </mat-form-field>  
        <button mat-flat-button class="full-width" color="primary" type="submit" [disabled]="loginForm.invalid || isSubmitting" [attr.aria-busy]="isSubmitting">
          {{ isSubmitting ? 'Signing in…' : 'Login' }}
        </button>
      </form>
    </mat-card-content>
    <mat-card-actions class="auth-card-actions">
      <p class="auth-link-row">New to Kangla? <a class="auth-link" routerLink="/register">Register</a></p>
      <p class="auth-link-row"><a class="auth-link" routerLink="/forgot-password">Forgot your password?</a></p>
      <p class="auth-link-row">Didn't receive the confirmation email? <a class="auth-link" routerLink="/registration-confirmation">Resend it</a></p>
    </mat-card-actions>
  </mat-card>  
</div>
