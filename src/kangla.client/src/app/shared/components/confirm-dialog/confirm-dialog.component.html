<h1 mat-dialog-title>{{ data.title }}</h1>
<div mat-dialog-content>
  <p>{{ data.message }}</p>
</div>
<div mat-dialog-actions>
  <button mat-button (click)="onCancelClick()">Cancel</button>
  <button mat-flat-button [class.danger-confirm-action]="data.tone !== 'primary'" (click)="onConfirmClick()">{{ data.confirmAction || 'Delete' }}</button>
</div>
