<mat-card class="detail-section">
  <mat-card-header><mat-card-title>Recent Soil Humidity</mat-card-title></mat-card-header>
  <mat-card-content>
    @if (measurements.length) {
      <table mat-table [dataSource]="measurements">
        <ng-container matColumnDef="dateTime"><th mat-header-cell *matHeaderCellDef>Measured</th><td mat-cell *matCellDef="let measurement">{{ measurement.dateTime | date:'short' }}</td></ng-container>
        <ng-container matColumnDef="soilHumidity"><th mat-header-cell *matHeaderCellDef>Raw value</th><td mat-cell *matCellDef="let measurement">{{ measurement.soilHumidity }}</td></ng-container>
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
      </table>
    } @else {
      <p>No humidity measurements yet. Start the simulator to record them.</p>
    }
  </mat-card-content>
</mat-card>
